// Classes the Compose compiler should treat as stable, so composables compare them by value.
//
// The app passes read-only Kotlin collections built with immutable operations (copy, +, map,
// takeLast) and never mutates them after creation. Without this entry Compose compares them by
// instance, so a list derived during composition, such as SyncDeskState.summary, made the meeting
// record recompose on every state change (once a second while a call is running).
kotlin.collections.*

# This PC is dedicated to the project (16 cores, 64 GB), so builds may use most of it.
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.workers.max=24
# Reuses the configured task graph and task outputs between builds. Both were checked with the
# unit tests, the screenshot tasks and assembleRelease on 2026-11-12.
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The project path contains Korean characters; AGP blocks non-ASCII paths on Windows by default.
android.overridePathCheck=true
